spring.application.name=springJavaFX
spring.main.web-application-type=none
application.title=Spring Boot and Java FX

# app.data.dir e definido em runtime (JavaFXApplication.init), resolvendo o local
# correto por sistema operacional (ex: %LOCALAPPDATA% no Windows). Nao editar aqui.
spring.datasource.url=jdbc:sqlite:${app.data.dir}/springJavaFX.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite so aceita uma conexao de escrita por vez - evita erros "database is locked"
spring.datasource.hikari.maximum-pool-size=1

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
